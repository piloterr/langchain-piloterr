[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "langchain-piloterr"
version = "0.1.0"
description = "LangChain integration for Piloterr: Google search and website scraping tools, and a web page document loader."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Piloterr", email = "contact@piloterr.com" },
]
keywords = ["langchain", "piloterr", "web-scraping", "scraper", "search", "agents", "document-loader"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=0.3.15,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "langchain-tests>=0.3.5",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://www.piloterr.com"
Documentation = "https://github.com/piloterr/langchain-piloterr#readme"
Repository = "https://github.com/piloterr/langchain-piloterr"
Issues = "https://github.com/piloterr/langchain-piloterr/issues"

[tool.hatch.build.targets.sdist]
include = ["/langchain_piloterr", "/tests", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_piloterr"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
